name: Go Test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myscraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: myscraper/go.mod

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -v -race ./...
