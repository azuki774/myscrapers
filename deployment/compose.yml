services:
  myscrapers:
    build:
      context: ..
      dockerfile: build/moneyforward/Dockerfile
    image: myscrapers:latest
    container_name: myscrapers
    environment:
      TZ: Asia/Tokyo
      MF_OUTPUT_DIR: /data/out
      PLAYWRIGHT_DRIVER_PATH: /playwright/.driver
    volumes:
      - .:/data
      - playwright-driver:/playwright
    command: ["moneyforward", "--fetch"]

volumes:
  playwright-driver:
