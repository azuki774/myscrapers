services:
  myscrapers-mf:
    build:
      context: ..
      dockerfile: build/moneyforward/Dockerfile
    image: myscrapers-mf:latest
    container_name: myscrapers-mf
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./cookie.json:/data/cookie.json:ro
      - ./out:/data
    command: ["moneyforward", "--fetch"]
